name: Deploy

# The push to main is a pull request landing, and that pull request's CI run is the gate: harness-pr land --catch-up
# squash-merges exactly the tree it verified, and git hooks refuse direct pushes to main. CI does not run on main, so
# there is nothing here to wait for (this used to follow CI's run on main through workflow_run).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A push to the main branch, or a manual run on it (github.ref, because ref_name also matches a tag named main). The
    # branches filter above already leaves out other pushes, but a manual run can pick any branch or tag, and this guard
    # is what refuses them. Keep it one bare expression on one line: text outside a `${{ }}` would make it always true.
    # GitHub's == ignores case, so a branch named Main would pass: a known residual.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On a push, github.sha is the pushed commit; on a manual run, the tip of main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Deploy
        run: scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
