name: CI

# Pull requests only. harness-pr land --catch-up squash-merges exactly the tree a green pull request run verified, so a
# second run on the push to main would only cost Actions minutes. That push starts Deploy.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # GitHub's runners while the repository is public (free); back to [self-hosted, linux, harness-mac] when private (#179).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: scripts/verify.sh
