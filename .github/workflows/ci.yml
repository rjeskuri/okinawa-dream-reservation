name: CI

# Pull requests only. harness-pr land --catch-up squash-merges exactly the tree a green pull request run verified, so a
# second run on the push to main would only cost Actions minutes. That push starts Deploy.
on:
  pull_request:
  # A manual run can draw every randomized case. A pull request run has no inputs, so PROPERTY_RUNS stays empty and the
  # randomized tests draw their bounded count.
  workflow_dispatch:
    inputs:
      property_runs:
        description: "PROPERTY_RUNS for the randomized tests: full runs every case, a number runs that many, empty the bounded count"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # GitHub's runners while the repository is public (free); back to [self-hosted, linux, harness-mac] when private (#179).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        # Through env, never interpolated into the script.
        env:
          PROPERTY_RUNS: ${{ inputs.property_runs }}
        run: scripts/verify.sh
